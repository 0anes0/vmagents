name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck zsh openssh-client desktop-file-utils
          pip install asyncssh 'textual>=8,<9'
      - name: shellcheck
        run: shellcheck vmagents install.sh
      - name: tests
        run: python3 -m unittest discover -v -s tests -t .
