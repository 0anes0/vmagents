<!doctype html>
<html><head><meta charset="utf-8"><style>
* { margin: 0; box-sizing: border-box; }
body { width: 1280px; height: 640px; background: #0e1116; color: #e6edf3; font-family: "Inter", "DejaVu Sans", sans-serif;
  display: flex; overflow: hidden; }
.left { width: 560px; padding: 64px 0 56px 72px; display: flex; flex-direction: column; }
.brand { display: flex; align-items: center; gap: 18px; }
.logo { width: 76px; height: 76px; border-radius: 18px; background: #d97757; display: flex; align-items: center; justify-content: center; }
h1 { font-size: 64px; font-weight: 800; letter-spacing: -1.5px; }
.tag { margin-top: 34px; font-size: 38px; line-height: 1.22; font-weight: 700; }
.tag em { font-style: normal; color: #e8896a; }
.sub { margin-top: 22px; font-size: 22px; line-height: 1.45; color: #9aa4ae; }
.agents { margin-top: auto; display: flex; flex-wrap: nowrap; gap: 7px; }
.agents span { font-size: 15px; white-space: nowrap; color: #c9d1d9; background: #1d232c; border: 1px solid #2a313b; border-radius: 999px; padding: 6px 11px; }
.right { flex: 1; position: relative; }
.shot { position: absolute; left: 30px; top: 70px; width: 760px; border-radius: 14px; border: 1px solid #2a313b;
  box-shadow: 0 20px 60px rgba(0,0,0,.55); }
.cmd { position: absolute; left: 70px; bottom: 54px; font: 22px "JetBrains Mono", "DejaVu Sans Mono", monospace;
  background: #161b22; border: 1px solid #2a313b; border-radius: 10px; padding: 14px 20px; color: #e6edf3;
  box-shadow: 0 10px 30px rgba(0,0,0,.5); }
.cmd b { color: #3fb950; }
</style></head><body>
<div class="left">
  <div class="brand">
    <div class="logo"><svg width="46" height="46" viewBox="0 0 100 100"><path d="M18 22 42 50 18 78" fill="none" stroke="#fff7f2" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/><rect x="50" y="68" width="34" height="12" rx="4" fill="#fff7f2"/></svg></div>
    <h1>vmagents</h1>
  </div>
  <div class="tag">AI coding agents in a <em>virtual machine</em>. Undo with one command.</div>
  <div class="sub">Let them act without asking: snapshots, background tasks, issue to pull request, from the terminal UI or your phone.</div>
  <div class="agents"><span>Claude Code</span><span>Codex</span><span>Gemini CLI</span><span>OpenCode</span><span>aider</span></div>
</div>
<div class="right">
  <img class="shot" src="../ui.png">
  <div class="cmd"><b>$</b> vmagents undo dev</div>
</div>
</body></html>
